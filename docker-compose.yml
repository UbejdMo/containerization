# The whole stack: `docker compose up` starts the API and its database.
#
# Credentials come from .env, the schema from db/schema.sql.
#
# Docker Compose reads .env from this directory automatically, so ${POSTGRES_USER}
# and friends below are filled in without any --env-file flag. .env is gitignored;
# .env.example is the committed template.
#
# The named volume is the whole point of running the database this way: without
# it, Postgres writes its data inside the container's own writable layer, and
# `docker compose down` throws that layer away along with every row. With it,
# the data lives in a volume Docker manages separately, so the container is
# disposable and the data is not.

services:
  db:
    image: postgres:17-alpine
    container_name: tasks-db
    environment:
      # These three are read by the postgres image's entrypoint on first start,
      # and they are what create the role and the database inside the volume.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container. The container side is always 5432; the host side is a
      # variable because 5432 is a popular port - a locally installed Postgres
      # service will already have it, and Docker publishing "successfully" on a
      # taken port means connections silently reach the wrong server. Keep this
      # in step with the host in DATABASE_URL.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in /docker-entrypoint-initdb.d is executed by the postgres
      # image the first time the data directory is initialised - which is
      # how the tasks table gets created without the app owning any DDL.
      # Read-only, because the container has no business editing our schema.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # Postgres accepts TCP connections a moment before it is ready to answer
      # queries, so "the port is open" is not the same as "the database is up".
      # pg_isready asks the server itself, which is what the app will wait on.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tasks-api
    environment:
      # Built here rather than taken from .env, because the two are genuinely
      # different addresses for the same server: .env's DATABASE_URL points at
      # the published port on the host, which is what a locally run
      # `uvicorn main:app` needs. From inside this network the app reaches the
      # database by its service name, db, on its real port 5432 - no published
      # port involved.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${APP_HOST_PORT}:8000"
    depends_on:
      db:
        # The condition is the point. A bare `depends_on: [db]` only waits for
        # the container to start, and Postgres takes a few seconds after that
        # before it will answer a query - long enough for the app to come up,
        # fail to connect, and exit. service_healthy waits for the pg_isready
        # healthcheck above to actually pass.
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
